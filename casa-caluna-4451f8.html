  &lt;div class=&quot;grid-2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;card-title&quot;&gt;Category scores&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Cleanliness&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Accuracy&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:98%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.9&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Check-in&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:98%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.9&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Communication&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Location&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:96%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.8&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Value&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:98%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.9&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;narrative&quot;&gt;&lt;div class=&quot;narrative-title&quot;&gt;What guests rate highest&lt;/div&gt;&lt;p&gt;92% of all reviews are 5 stars. Cleanliness and communication both score a perfect 5.0. Guests most often mention hospitality, cleanliness and the location.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;narrative-title&quot; style=&quot;margin:32px 0 16px;&quot;&gt;Recent guest reviews · September&lt;/div&gt;&lt;div class=&quot;reviews-grid one-col&quot;&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;A&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Adam J.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 08–Sep 17 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★★&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;My wife, my daughter and I had a great stay at this Villa. Villa was exactly as described. The whole place was spotless and regular cleaning offered to both inside Villa and pool area. A short walk up the road are great places to grab a coffee, hit the gym or grab some food. The walk is a bit of a challenge with a baby stroller but we managed. In terms of construction work, yes there is work going to the Villa next door. It didn’t bother us and the fact we had an outdoor speaker on most of the time meant we didn’t really hear any of the noise, which was minimal. The pool has a shallow splash area as part of main pool which was great for our 1 year old to splash around as well as use as a step to jump into the deeper pool area. Any issue or questions were responded to quickly by our hosts.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
