* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Arial, sans-serif;

.nav { position: sticky; top: 0; z-index: 100; background: rgba(251,246,239,0.95); backdrop-filter: blur(8px);

.nav-brand { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 20px; color: var(--brand-dark); }
.nav-brand small { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; color: var(--text-mid); font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; margin-left: 6px; }
.nav-links { display: flex; gap: 18px; }
.nav-links a { color: var(--text-mid); text-decoration: none; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; transition: color .2s; }
.nav-links a:hover { color: var(--brand-dark); }
@media (max-width: 768px) { .nav-links { display: none; } }
.container { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
section { padding: 72px 0; }
section + section { border-top: 1px solid var(--border); }
.hero { background: linear-gradient(135deg, var(--brand-light) 0%, var(--brand-bg) 100%);
  padding: 80px 24px 60px; text-align: center; border-bottom: 3px solid var(--brand-mid); }
.hero-eyebrow { font-size: 12px; color: var(--brand-dark); font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 12px; }
.hero-title { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: clamp(48px, 8vw, 92px); color: var(--brand-dark); line-height: 1; letter-spacing: -0.02em; margin-bottom: 8px; }
.hero-sub { font-size: 20px; color: var(--text-mid); margin-bottom: 40px; letter-spacing: 0.02em; }
.hero-brand { display: inline-flex; align-items: center; gap: 12px; padding: 8px 20px; background: white; border-radius: 100px; box-shadow: var(--shadow); font-size: 12px; font-weight: 600; color: var(--brand-dark); letter-spacing: 0.1em; text-transform: uppercase; }
.hero-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-mid); }
.hero-logo { display: block; height: 120px; width: auto; margin: 0 auto 16px; }
.stats-strip { max-width: 1240px; margin: -40px auto 0; padding: 0 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
@media (max-width: 900px) { .stats-strip { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .stats-strip { grid-template-columns: 1fr; } }
.stat-card { background: white; padding: 24px; border-radius: 14px; box-shadow: var(--shadow); border-top: 3px solid var(--brand-mid); }
.stat-label { font-size: 10px; color: var(--text-mid); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.stat-value { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 36px; color: var(--brand-dark); line-height: 1.05; }
.stat-value.sm { font-size: 28px; }
.stat-sub { font-size: 12px; color: var(--text-mid); margin-top: 6px; }
.stat-delta { font-size: 12px; font-weight: 600; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
.stat-delta.up { color: var(--success); } .stat-delta.down { color: var(--danger); } .stat-delta.flat { color: var(--text-mid); }
.section-eyebrow { font-size: 11px; color: var(--brand-mid); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
.section-title { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: clamp(36px, 5vw, 56px); color: var(--brand-dark); line-height: 1; margin-bottom: 24px; }
.section-desc { font-size: 16px; color: var(--text-mid); max-width: 680px; margin-bottom: 40px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; }
@media (max-width: 900px) { .grid-2, .grid-3, .grid-2-1 { grid-template-columns: 1fr; } }
.card { background: white; padding: 28px; border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.card-title { font-size: 14px; color: var(--brand-dark); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; }
.card-value { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 40px; color: var(--brand-dark); line-height: 1; margin-bottom: 4px; }
.card-sub { font-size: 13px; color: var(--text-mid); }
.chart-wrap { position: relative; height: 300px; }
.chart-wrap.tall { height: 380px; } .chart-wrap.short { height: 220px; }
.narrative { background: var(--cream); padding: 32px; border-radius: 14px; border-left: 4px solid var(--brand-mid); }
.narrative-title { font-size: 12px; color: var(--brand-dark); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
.narrative p { font-size: 15px; color: var(--text-dark); margin-bottom: 10px; } .narrative p:last-child { margin-bottom: 0; }

.tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
@media (max-width: 700px) { .tier-grid { grid-template-columns: 1fr; } }
.tier-card { padding: 24px; border-radius: 14px; text-align: center; border: 2px solid var(--border); background: white; }
.tier-card.low { border-color: var(--warn); }
.tier-card.normal { border-color: var(--brand-mid); }
.tier-card.high { border-color: var(--brand-dark); background: var(--brand-dark); color: white; }
.tier-card.high .tier-label, .tier-card.high .tier-price { color: white; }
.tier-card.high .tier-detail { color: var(--brand-light); }
.tier-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-mid); margin-bottom: 12px; }
.tier-price { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 30px; color: var(--brand-dark); margin-bottom: 4px; }
.tier-detail { font-size: 12px; color: var(--text-mid); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 12px 14px; background: var(--brand-dark); color: white; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text-dark); }
tr:hover td { background: var(--cream); } tr.highlight td { background: var(--brand-light); font-weight: 600; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; }
.pill.us { background: var(--brand-dark); color: white; } .pill.comp { background: var(--cream); color: var(--text-mid); }
.projection-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.projection-table th, .projection-table td { padding: 10px 14px; text-align: right; font-size: 13px; }
.projection-table th { background: var(--brand-dark); color: white; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.projection-table th:first-child, .projection-table td:first-child { text-align: left; }
.projection-table tbody tr:nth-child(even) { background: var(--cream); }
.projection-table tr.total-row td { font-weight: 700; background: var(--brand-light); border-top: 2px solid var(--brand-mid); }
.expandable { background: white; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
.expand-header { padding: 24px 28px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background .2s; }
.expand-header:hover { background: var(--cream); }
.expand-header .expand-title { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 24px; color: var(--brand-dark); }
.expand-header .expand-icon { font-size: 24px; color: var(--brand-mid); transition: transform .3s; }
.expandable.open .expand-icon { transform: rotate(45deg); }
.expand-content { max-height: 0; overflow: hidden; transition: max-height .4s ease; }
.expandable.open .expand-content { max-height: 5000px; }
.expand-inner { padding: 0 28px 28px; }
.footer { background: var(--brand-dark); color: white; padding: 48px 24px; text-align: center; }
.footer-brand { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 32px; margin-bottom: 8px; }
.footer-tag { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-bottom: 24px; }
.footer-contact { font-size: 14px; opacity: 0.85; } .footer-contact span { margin: 0 12px; }
.footer-mini { font-size: 11px; margin-top: 20px; opacity: 0.5; }&lt;/style&gt;

    &lt;div class=&quot;grid-2-1&quot;&gt;

      &lt;div class=&quot;narrative&quot;&gt;
        &lt;div class=&quot;narrative-title&quot;&gt;The story this month&lt;/div&gt;
        &lt;p&gt;August generated &lt;strong&gt;Rp 19.27M in total revenue&lt;/strong&gt; from organic bookings.&lt;/p&gt;
        &lt;p&gt;11 paid OTA nights delivered &lt;strong&gt;Rp 19.27M&lt;/strong&gt; at an average nightly rate of &lt;strong&gt;Rp 1,751,455&lt;/strong&gt;.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Net profit landed at Rp 2.82M with a 15% margin.&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;&lt;em&gt;August operating expenses were higher than a normal month because one-off setup items were bought and expensed this month — coffee machine, CCTV, lock box, ironing board, clothesline, first-aid kit, floating tube and similar (Rp 4.35M in total). Without these one-off purchases, net profit would have been Rp 7.18M (37% margin). Future months will normalize.&lt;/em&gt;&lt;/p&gt;

      &lt;p&gt;August OpEx includes Rp 4.35M of one-off equipment and setup purchases for the new villa (coffee machine, CCTV, lock box, ironing board, clothesline, first-aid kit) plus electricity from the July owner-stay (Rp 944,724) carried over into this month&#x27;s ledger. Marketing Expense (Rp 853k, OTA commissions on 4 review-campaign bookings) is shown separately in Other Expenses.&lt;/p&gt;
