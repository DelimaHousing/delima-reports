-spacing:0.12em;text-transform:uppercase;color:var(--text-mid);margin-bottom:8px;&quot;&gt;Interactions&lt;/div&gt;&lt;div style=&quot;font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-size:34px;color:var(--brand-dark);line-height:1.1;&quot;&gt;192&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:var(--text-mid);margin-top:6px;&quot;&gt;51.6% followers · 48.4% non-followers&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;text-align:center;&quot;&gt;&lt;div style=&quot;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-mid);margin-bottom:8px;&quot;&gt;Profile visits&lt;/div&gt;&lt;div style=&quot;font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-size:34px;color:var(--brand-dark);line-height:1.1;&quot;&gt;146&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:var(--text-mid);margin-top:6px;&quot;&gt;accounts&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;text-align:center;&quot;&gt;&lt;div style=&quot;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-mid);margin-bottom:8px;&quot;&gt;Link taps&lt;/div&gt;&lt;div style=&quot;font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-size:34px;color:var(--brand-dark);line-height:1.1;&quot;&gt;11×&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:var(--text-mid);margin-top:6px;&quot;&gt;external link&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;narrative&quot; style=&quot;margin-top:32px;&quot;&gt;&lt;div class=&quot;narrative-title&quot;&gt;Performance recap&lt;/div&gt;&lt;p&gt;September was a breakout month for reach. Total views grew 299% from August, from about 1,275 to 5,089 across 21 posts, and the growth came from new people: non-followers made up 46.5% of views and 48.4% of interactions. Engagement was strong at 3.8% of total reach, and 146 accounts visited the profile after seeing a post.&lt;/p&gt;&lt;p&gt;The next step is converting that attention into action: of those 146 visits, 11 became new followers and 11 tapped the link. The content is reaching the right people, so next month’s focus is making the profile and call to action work as hard as the content already does.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;narrative&quot; style=&quot;margin-top:24px;border-left-color:var(--warn);&quot;&gt;&lt;div class=&quot;narrative-title&quot; style=&quot;color:var(--warn);&quot;&gt;For your decision · October&lt;/div&gt;&lt;p&gt;The villa is on a long-term booking until early November, so there are two options: keep marketing running through October to maintain momentum, or pause and restart toward the end of October, saving marketing spend in a month with no bookings to convert.&lt;/p&gt;&lt;p&gt;Our suggestion is to stay light but visible through October with fewer posts, then go full push from the end of the month into November, so the villa reopens to an audience that is already paying attention. Please let us know which direction you prefer.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;margin-top:24px;&quot;&gt;&lt;div class=&quot;card-title&quot;&gt;Instagram grid · September&lt;/div&gt;&lt;img src=&quot;data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAPAA8AAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAKjBLADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqK
