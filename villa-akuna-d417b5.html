  &lt;div style=&quot;background:linear-gradient(90deg, #FBF6EF, #F4D9CC); border-left:4px solid var(--gold); padding:16px 20px; border-radius:10px; margin-bottom:24px; text-align:center;&quot;&gt;
  &lt;strong style=&quot;font-size:15px; color:var(--brand-dark);&quot;&gt;4.96⭐ · 25 reviews on Airbnb · Guest favourite · 1 new review since the August report&lt;/strong&gt;&lt;/div&gt;
  &lt;div class=&quot;grid-2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;card-title&quot;&gt;Category scores&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Cleanliness&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Accuracy&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:98%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.9&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Check-in&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Communication&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:98%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.9&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Location&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:94%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.7&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Value&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:98%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.9&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;narrative&quot;&gt;&lt;div class=&quot;narrative-title&quot;&gt;What guests rate highest&lt;/div&gt;&lt;p&gt;96% of all reviews are 5 stars. Cleanliness and check-in both score a perfect 5.0; guests most often mention hospitality and cleanliness.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;narrative-title&quot; style=&quot;margin:32px 0 16px;&quot;&gt;Recent guest reviews · September&lt;/div&gt;&lt;div class=&quot;reviews-grid two-col&quot;&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;J&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Jolo M.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 26–Oct 01 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★★&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;The Delima team were so very helpful during our stay, helping us arrange airport pickup, constantly communicating (like when house-cleaning was coming), and being very clear on all instructions! Villa Akuna was a beautiful stay, and we enjoyed our time resting in between all the Bali hustle &amp;amp; bustle :)&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;B&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Batoul D.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 07–Sep 17 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★★&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;We had such a wonderful stay here and can honestly recommend this place 100%! Everything was just perfect. The accommodation was regularly cleaned and always felt fresh and comfortable. The hosts were incredibly friendly, helpful, and welcoming, and they really went out of their way to make sure we had everything we needed. The beach is within walking distance, and the area itself is very peaceful and relaxing. One of our favorite things was the pool area. You have 100% privacy also at the pool. At the same time, you still get plenty of sunshine, so you can relax and sunbathe without being in the shade. We would definitely recommend renting a scooter, as it makes it super easy to explore the area and get around to different places per example canggu etc. We really enjoyed our time here and felt very comfortable from the beginning. We can highly recommend this place and would absolutely stay here again. We would definitely come back! ❤️&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

.stat-label{font-size:10px;color:var(--text-mid);font-weight:600;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-weight:900;letter-spacing:0.02em;font-size:36px;color:var(--brand-dark);line-height:1.05}
.stat-value.sm{font-size:28px}
.stat-sub{font-size:12px;color:var(--text-mid);margin-top:6px}
.section-eyebrow{font-size:11px;color:var(--brand-mid);font-weight:700;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:8px}
.section-title{font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-weight:900;letter-spacing:0.02em;font-size:clamp(36px,5vw,56px);color:var(--brand-dark);line-height:1;margin-bottom:24px}
.section-desc{font-size:16px;color:var(--text-mid);max-width:680px;margin-bottom:40px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:32px}
@media(max-width:900px){.grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr}}
.card{background:white;padding:28px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:14px;color:var(--brand-dark);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:16px}
.chart-wrap{position:relative;height:300px}
.chart-wrap.tall{height:380px}.chart-wrap.short{height:220px}
.narrative{background:var(--cream);padding:32px;border-radius:14px;border-left:4px solid var(--brand-mid)}
.narrative-title{font-size:12px;color:var(--brand-dark);font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px}
.narrative p{font-size:15px;color:var(--text-dark);margin-bottom:10px}
.narrative p:last-child{margin-bottom:0}
.narrative ul{margin:8px 0 0 20px}
.narrative li{font-size:14px;color:var(--text-dark);margin-bottom:6px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 14px;background:var(--brand-dark);color:white;font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase}
td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text-dark)}
tr:hover td{background:var(--cream)}
tr.highlight td{background:var(--brand-light);font-weight:600}
.pill{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600}
.pill.us{background:var(--brand-dark);color:white}.pill.comp{background:var(--cream);color:var(--text-mid)}
.projection-table{width:100%;border-collapse:collapse;margin-top:16px}
.projection-table th,.projection-table td{padding:10px 14px;text-align:right;font-size:13px}
.projection-table th{background:var(--brand-dark);color:white;font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase}
.projection-table th:first-child,.projection-table td:first-child{text-align:left}
.projection-table tbody tr:nth-child(even){background:var(--cream)}
.projection-table tr.total-row td{font-weight:700;background:var(--brand-light);border-top:2px solid var(--brand-mid)}
.expandable{background:white;border-radius:14px;border:1px solid var(--border);overflow:hidden}
.expand-header{padding:24px 28px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.expand-header:hover{background:var(--cream)}
.expand-header .expand-title{font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-weight:900;letter-spacing:0.02em;font-size:24px;color:var(--brand-dark)}
.expand-header .expand-icon{font-size:24px;color:var(--brand-mid);transition:transform .3s}
.expandable.open .expand-icon{transform:rotate(45deg)}
.expand-content{max-height:0;overflow:hidden;transition:max-height .4s ease}
.expandable.open .expand-content{max-height:5000px}
.expand-inner{padding:0 28px 28px}
.footer{background:var(--brand-dark);color:white;padding:48px 24px;text-align:center}
.footer-brand{font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-weight:900;letter-spacing:0.02em;font-size:32px;margin-bottom:8px}
.footer-tag{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.7;margin-bottom:24px}
.footer-contact{font-size:14px;opacity:0.85}.footer-contact span{margin:0 12px}
.footer-mini{font-size:11px;margin-top:20px;opacity:0.5}
.formula-strip{max-width:1240px;margin:32px auto 0;padding:24px;background:var(--cream);border-radius:14px;border:1px dashed var(--brand-mid);display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.formula-strip{grid-template-columns:1fr}}
.formula-item{font-size:12px;color:var(--text-mid)}
.formula-item strong{color:var(--brand-dark);display:block;margin-bottom:4px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase}
.subvilla-header{background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand-mid) 100%);color:white;padding:32px;border-radius:14px;margin-bottom:32px}
.subvilla-header .sv-eyebrow{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.8;margin-bottom:6px}
.subvilla-header .sv-name{font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-weight:900;letter-spacing:0.02em;font-size:44px;line-height:1;margin-bottom:8px}
.subvilla-header .sv-sub{font-size:14px;opacity:0.9}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}
@media(max-width:900px){.compare-grid{grid-template-columns:1fr}}
.compare-card{background:white;border-radius:14px;box-shadow:var(--shadow);padding:24px;border-top:4px solid var(--brand-mid)}
.compare-card h3{font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-size:24px;color:var(--brand-dark);margin-bottom:16px}
.compare-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.compare-metrics .cm-label{font-size:10px;color:var(--text-mid);letter-spacing:0.1em;text-transform:uppercase;font-weight:600}
.compare-metrics .cm-value{font-family:&#x27;Impact&#x27;,&#x27;Arial Black&#x27;,sans-serif;font-size:22px;color:var(--brand-dark);line-height:1.2;margin-bottom:8px}&lt;/style&gt;
&lt;style&gt;
/* ===== REVIEWS ===== */
.reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
@media (max-width: 900px) { .reviews-grid { grid-template-columns: 1fr; } }
.reviews-grid.two-col { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 700px) { .reviews-grid.two-col { grid-template-columns: 1fr; } }
.reviews-grid.one-col { grid-template-columns: 1fr; }
.review-card { background: white; padding: 24px; border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; }
.review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.review-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-mid); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; }
.review-name { font-weight: 600; font-size: 14px; color: var(--text-dark); }
.review-meta { font-size: 11px; color: var(--text-mid); }
.review-stars { color: var(--gold); font-size: 14px; letter-spacing: 1px; margin-bottom: 10px; }
.review-text { font-size: 13px; color: var(--text-dark); line-height: 1.6; }
.review-trans { margin-top: 8px; font-style: italic; color: var(--text-mid); }
&lt;/style&gt;
