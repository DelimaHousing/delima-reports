  &lt;div style=&quot;background:linear-gradient(90deg, #FBF6EF, #F4D9CC); border-left:4px solid var(--gold); padding:16px 20px; border-radius:10px; margin-bottom:24px; text-align:center;&quot;&gt;

  &lt;div class=&quot;grid-2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;card-title&quot;&gt;Category scores&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Cleanliness&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Accuracy&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Check-in&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Communication&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Location&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:98%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;4.9&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rbar&quot;&gt;&lt;span&gt;Value&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;span style=&quot;width:100%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;5.0&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;narrative&quot;&gt;&lt;div class=&quot;narrative-title&quot;&gt;What guests rate highest&lt;/div&gt;&lt;p&gt;100% of all reviews are 5 stars. Every category scores 5.0 except location (4.9). Guests most often mention the pool, hospitality and the location.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;narrative-title&quot; style=&quot;margin:32px 0 16px;&quot;&gt;Recent guest reviews · September&lt;/div&gt;&lt;div class=&quot;reviews-grid two-col&quot;&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;T&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Tiffany F.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 28–Oct 01 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★★&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;We had the most fantastic stay at Casa Ginger! The villa was even more beautiful in my person! Staff were accommodating and friendly. Walking distance to many cafes and shops. We even walked to the beach!&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;L&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Lara Z.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 11–Sep 14 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★★&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;We had the most perfect stay! The house is incredible, perfect styling and our kids loved the pool and the swing. There was even a baby chair. Thank you so much for having us! Also Kedungu was way better than expected. Just a small surfer town with plenty of coffee bars and restaurants but still the old original Bali feeling. Thanks we will come back definitely!&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;T&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Teerapat J.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 19–Sep 21 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★★&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;We had a great time. The villa is amazing. It is so beautiful even more than the pictures. Very clean and private. Thoughtful designs and amenities. Took tons of good pictures in the house.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;B&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Benjamin B.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 05–Sep 09 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★☆&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;Very nice accommodation, this is a lovely place for a couple or a small family. The outdoor area is stunning, especially at night. The host is responsive and quickly helps if needed. The accommodation looks like the picture. The beach is close by walk (15min) and not crowded. Are is very nice, one of the best next to Canggu. The only minor points are that you have a lot of villas around, and with loud families, it can be very noisy, which can be unpleasant sometimes. The other one is that you don’t have full dark at night as the curtains don’t perfectly close, but this depends always on how people like morning light I would say.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

  background: rgba(251,246,239,0.95); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; justify-content: space-between; align-items: center;
}
.nav-brand { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 20px; color: var(--brand-dark); }
.nav-brand small { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; color: var(--text-mid); font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; margin-left: 6px; }
.nav-links { display: flex; gap: 18px; }
.nav-links a { color: var(--text-mid); text-decoration: none; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; transition: color .2s; }
.nav-links a:hover { color: var(--brand-dark); }
@media (max-width: 768px) { .nav-links { display: none; } }

/* ===== LAYOUT ===== */
.container { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
section { padding: 72px 0; }
section + section { border-top: 1px solid var(--border); }

/* ===== HERO ===== */
.hero {
  background: linear-gradient(135deg, var(--brand-light) 0%, var(--brand-bg) 100%);
  padding: 80px 24px 60px;
  text-align: center;
  border-bottom: 3px solid var(--brand-mid);
}
.hero-eyebrow { font-size: 12px; color: var(--brand-dark); font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 12px; }
.hero-title { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: clamp(48px, 8vw, 92px); color: var(--brand-dark); line-height: 1; letter-spacing: -0.02em; margin-bottom: 8px; }
.hero-sub { font-size: 20px; color: var(--text-mid); margin-bottom: 40px; letter-spacing: 0.02em; }
.hero-brand { display: inline-flex; align-items: center; gap: 12px; padding: 8px 20px; background: white; border-radius: 100px; box-shadow: var(--shadow); font-size: 12px; font-weight: 600; color: var(--brand-dark); letter-spacing: 0.1em; text-transform: uppercase; }
.hero-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-mid); }
.hero-logo { display: block; height: 120px; width: auto; margin: 0 auto 16px; }

/* ===== HEADLINE STATS ===== */
.stats-strip {
  max-width: 1240px; margin: -40px auto 0;
  padding: 0 24px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
}
@media (max-width: 900px) { .stats-strip { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .stats-strip { grid-template-columns: 1fr; } }
.stat-card {
  background: white; padding: 24px; border-radius: 14px;
  box-shadow: var(--shadow); border-top: 3px solid var(--brand-mid);
}
.stat-label { font-size: 10px; color: var(--text-mid); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.stat-value { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 36px; color: var(--brand-dark); line-height: 1.05; }
.stat-value.sm { font-size: 28px; }
.stat-sub { font-size: 12px; color: var(--text-mid); margin-top: 6px; }
.stat-delta { font-size: 12px; font-weight: 600; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
.stat-delta.up { color: var(--success); }
.stat-delta.down { color: var(--danger); }
.stat-delta.flat { color: var(--text-mid); }

/* ===== SECTION HEADERS ===== */
.section-eyebrow { font-size: 11px; color: var(--brand-mid); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
.section-title { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: clamp(36px, 5vw, 56px); color: var(--brand-dark); line-height: 1; margin-bottom: 24px; }
.section-desc { font-size: 16px; color: var(--text-mid); max-width: 680px; margin-bottom: 40px; }

/* ===== GRIDS ===== */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; }
@media (max-width: 900px) { .grid-2, .grid-3, .grid-2-1 { grid-template-columns: 1fr; } }

/* ===== CARDS ===== */
.card {
  background: white; padding: 28px; border-radius: 14px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.card-title { font-size: 14px; color: var(--brand-dark); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; }
.card-value { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 40px; color: var(--brand-dark); line-height: 1; margin-bottom: 4px; }
.card-sub { font-size: 13px; color: var(--text-mid); }

/* ===== CHARTS ===== */
.chart-wrap { position: relative; height: 300px; }
.chart-wrap.tall { height: 380px; }
.chart-wrap.short { height: 220px; }

/* ===== NARRATIVE ===== */
.narrative {
  background: var(--cream); padding: 32px; border-radius: 14px;
  border-left: 4px solid var(--brand-mid);
}
.narrative-title { font-size: 12px; color: var(--brand-dark); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
.narrative p { font-size: 15px; color: var(--text-dark); margin-bottom: 10px; }
.narrative p:last-child { margin-bottom: 0; }
.narrative ul { margin: 8px 0 0 20px; }
.narrative li { font-size: 14px; color: var(--text-dark); margin-bottom: 6px; }

/* ===== REVIEWS ===== */
.reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
@media (max-width: 900px) { .reviews-grid { grid-template-columns: 1fr; } }
.review-card {
  background: white; padding: 24px; border-radius: 14px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.review-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-mid); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; }
.review-name { font-weight: 600; font-size: 14px; color: var(--text-dark); }
.review-meta { font-size: 11px; color: var(--text-mid); }
.review-stars { color: var(--gold); font-size: 14px; letter-spacing: 1px; margin-bottom: 10px; }
.review-text { font-size: 13px; color: var(--text-dark); line-height: 1.6; }
.review-placeholder { color: var(--text-light); font-style: italic; }

/* ===== TABLES ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 12px 14px; background: var(--brand-dark); color: white; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text-dark); }
tr:hover td { background: var(--cream); }
tr.highlight td { background: var(--brand-light); font-weight: 600; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; }
.pill.us { background: var(--brand-dark); color: white; }
.pill.comp { background: var(--cream); color: var(--text-mid); }

/* ===== PRICING TIER ===== */
.tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
@media (max-width: 700px) { .tier-grid { grid-template-columns: 1fr; } }
.tier-card { padding: 24px; border-radius: 14px; text-align: center; border: 2px solid var(--border); background: white; }
.tier-card.low { border-color: var(--warn); }
.tier-card.normal { border-color: var(--brand-mid); }
.tier-card.high { border-color: var(--brand-dark); background: var(--brand-dark); color: white; }
.tier-card.high .tier-label, .tier-card.high .tier-price { color: white; }
.tier-card.high .tier-detail { color: var(--brand-light); }
.tier-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-mid); margin-bottom: 12px; }
.tier-price { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 30px; color: var(--brand-dark); margin-bottom: 4px; }
.tier-detail { font-size: 12px; color: var(--text-mid); }

/* ===== PROJECTIONS ===== */
.projection-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.projection-table th, .projection-table td { padding: 10px 14px; text-align: right; font-size: 13px; }
.projection-table th { background: var(--brand-dark); color: white; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.projection-table th:first-child, .projection-table td:first-child { text-align: left; }
.projection-table tbody tr:nth-child(even) { background: var(--cream); }
.projection-table tr.total-row td { font-weight: 700; background: var(--brand-light); border-top: 2px solid var(--brand-mid); }

/* ===== EXPANDABLE FINANCIALS ===== */
.expandable {
  background: white; border-radius: 14px; border: 1px solid var(--border);
  overflow: hidden;
}
.expand-header {
  padding: 24px 28px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  transition: background .2s;
}
.expand-header:hover { background: var(--cream); }
.expand-header .expand-title { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 24px; color: var(--brand-dark); }
.expand-header .expand-icon { font-size: 24px; color: var(--brand-mid); transition: transform .3s; }
.expandable.open .expand-icon { transform: rotate(45deg); }
.expand-content { max-height: 0; overflow: hidden; transition: max-height .4s ease; }
.expandable.open .expand-content { max-height: 5000px; }
.expand-inner { padding: 0 28px 28px; }

/* ===== PLACEHOLDER BLOCKS ===== */
.placeholder-block {
  padding: 32px; background: var(--cream); border: 2px dashed var(--brand-mid);
  border-radius: 14px; text-align: center;
}
.placeholder-block .ph-title { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--brand-mid); font-weight: 700; margin-bottom: 8px; }
.placeholder-block .ph-body { font-size: 14px; color: var(--text-mid); }

/* ===== FOOTER ===== */
.footer {
  background: var(--brand-dark); color: white; padding: 48px 24px; text-align: center;
}
.footer-brand { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 32px; margin-bottom: 8px; }
.footer-tag { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-bottom: 24px; }
.footer-contact { font-size: 14px; opacity: 0.85; }
.footer-contact span { margin: 0 12px; }
.footer-mini { font-size: 11px; margin-top: 20px; opacity: 0.5; }

        &lt;p&gt;August generated &lt;strong&gt;Rp 79.99M in total revenue&lt;/strong&gt; — the best month of the year so far, up 8% MoM vs July.&lt;/p&gt;
        &lt;p&gt;Nine paid OTA nights contributed &lt;strong&gt;Rp 26.75M&lt;/strong&gt;, while &lt;strong&gt;16 direct-booked nights (Jana L. 15n + Jana Direct 1n)&lt;/strong&gt; added &lt;strong&gt;Rp 47.45M&lt;/strong&gt;. Two cancelled OTA nights (dates blocked, fees retained) added &lt;strong&gt;Rp 5.80M&lt;/strong&gt;. Property-wide ADR landed at &lt;strong&gt;Rp 2,963k&lt;/strong&gt; across 27 occupied nights.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Net profit landed at ~Rp 50.0M with a 62.5% margin&lt;/strong&gt; after the yearly Internet prepay (Rp 2.93M, one-time) is booked in Aug — rate discipline held and the tax base excludes direct bookings.&lt;/p&gt;

<script>
const bs=[...document.querySelectorAll('.m')], fs=[...document.querySelectorAll('iframe')];
function show(m){ if(!fs.some(f=>f.dataset.m===m)) m=fs[0].dataset.m;
  fs.forEach(f=>f.hidden=f.dataset.m!==m); bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
  try{history.replaceState(null,'','#'+m)}catch(e){} }
bs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.m)));
show(location.hash.slice(1));
</script></body></html>
