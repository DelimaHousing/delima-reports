  &lt;div class=&quot;narrative-title&quot; style=&quot;margin:32px 0 16px;&quot;&gt;Recent guest reviews · September&lt;/div&gt;&lt;div class=&quot;reviews-grid two-col&quot;&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;C&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Colleen C.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 21–Sep 24 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★★&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;I had a lovely stay at Villa Palmara. The villa was beautiful, clean, and peaceful, and it’s exactly as it looks in the pictures. Everything was well looked after, and the hospitality was warm and welcoming. I really enjoyed my stay and would happily come back!&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-card&quot;&gt;&lt;div class=&quot;review-header&quot;&gt;&lt;div class=&quot;review-avatar&quot;&gt;B&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;review-name&quot;&gt;Björn R.&lt;/div&gt;&lt;div class=&quot;review-meta&quot;&gt;Sep 04–Sep 13 · Airbnb&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;review-stars&quot;&gt;★★★★★&lt;/div&gt;&lt;div class=&quot;review-text&quot;&gt;We had such a wonderful stay at this beautiful villa in Bali! The villa was clean, comfortable, beautifully designed, and looked exactly like the pictures. We felt very welcome and comfortable from the moment we arrived. We would absolutely stay here again and highly recommend this villa to anyone visiting Bali. Thank you for making our stay so special!&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
