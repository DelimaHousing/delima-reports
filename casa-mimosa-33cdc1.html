.expandable.open .expand-icon { transform: rotate(45deg); }
.expand-content { max-height: 0; overflow: hidden; transition: max-height .4s ease; }
.expandable.open .expand-content { max-height: 5000px; }
.expand-inner { padding: 0 28px 28px; }

.footer {
  background: var(--brand-dark); color: white; padding: 48px 24px; text-align: center;
}
.footer-brand { font-family: &#x27;Impact&#x27;, &#x27;Arial Black&#x27;, sans-serif; font-weight: 900; letter-spacing: 0.02em; font-size: 32px; margin-bottom: 8px; }
.footer-tag { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-bottom: 24px; }
.footer-contact { font-size: 14px; opacity: 0.85; }
.footer-contact span { margin: 0 12px; }
.footer-mini { font-size: 11px; margin-top: 20px; opacity: 0.5; }

      &lt;p&gt;&lt;strong&gt;Management fee for Casa Mimosa set at 12%.&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;High August expenses driven by full annual Internet payment (Rp 3.33M)&lt;/strong&gt; — normalized monthly baseline is ~Rp 277k. Excluding this one-off, Aug OpEx would have been ~Rp 3.3M lower and margin would sit at ~49% instead of 42%.&lt;/p&gt;
      &lt;p&gt;Net profit landed at &lt;strong&gt;Rp 18.54M&lt;/strong&gt; vs Rp 20.27M in July (−Rp 1.73M).&lt;/p&gt;
      &lt;p&gt;Total operational expenses of &lt;strong&gt;Rp 10.68M&lt;/strong&gt; (22.9% of revenue) — includes the annual internet prepay of Rp 3.33M booked in August. OTA commission absorbed Rp 8.16M (17.5%) — reflects Airbnb host fees plus 11% Indonesian VAT on the Booking.com commission. Management fee at Rp 4.62M (12%) and government tax at Rp 4.67M.&lt;/p&gt;
